<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Matte Black Brutalist Base -->
  <rect width="100" height="100" fill="#121212" rx="8" />

  <!-- Tactical Grid / Crosshairs -->
  <path d="M 0 50 L 100 50 M 50 0 L 50 100" stroke="#5A5A5A" stroke-width="1" opacity="0.3" />
  
  <!-- Glitched 'A' -->
  <!-- Blood Red Offset -->
  <text x="55" y="75" font-family="'Courier Prime', monospace, sans-serif" font-size="70" font-weight="bold" fill="#C73030" text-anchor="middle">A</text>
  <!-- Grunge Orange Offset -->
  <text x="47" y="68" font-family="'Courier Prime', monospace, sans-serif" font-size="70" font-weight="bold" fill="#E86A33" text-anchor="middle">A</text>
  <!-- Primary Crisp White -->
  <text x="50" y="72" font-family="'Courier Prime', monospace, sans-serif" font-size="70" font-weight="bold" fill="#F4F4F4" text-anchor="middle">A</text>

  <!-- Jagged Strike (Yellow) -->
  <path d="M 10 75 L 45 75 L 55 60 L 90 70" fill="none" stroke="#DBA520" stroke-width="4" stroke-linejoin="miter" />
</svg>

