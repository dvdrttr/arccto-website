<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Offset shadow (Deep Charcoal) -->
  <rect x="10" y="10" width="80" height="80" fill="#1C1C1C" />
  <!-- Main box (Paper Off-White) -->
  <rect x="5" y="5" width="80" height="80" fill="#F4F1EA" stroke="#1C1C1C" stroke-width="4" />
  <!-- Monospace 'A' (Rust Red) -->
  <text x="45" y="65" font-family="monospace, sans-serif" font-size="60" font-weight="bold" fill="#C84B31" text-anchor="middle">A</text>
</svg>
