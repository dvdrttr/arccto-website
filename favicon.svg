<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pitch Black Base -->
  <rect width="100" height="100" fill="#080808" />
  
  <!-- Thick Roadcase Border -->
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#FFFFFF" stroke-width="10" />
  
  <!-- Heavy Monolithic 'A' -->
  <text x="50" y="74" font-family="'Inter', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  
  <!-- Orange "Sticker" Block -->
  <rect x="60" y="60" width="30" height="30" fill="#E85D04" />
</svg>


