<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rotated background stripes mimicking the ripped layout from 1784337151474.jpg -->
  <g transform="rotate(-4 50 50)">
    <!-- Mustard Yellow -->
    <rect x="15" y="15" width="20" height="70" fill="#E5B345" />
    <!-- Crimson Red (Center & Tallest) -->
    <rect x="40" y="10" width="20" height="80" fill="#D62D2D" />
    <!-- Muted Teal -->
    <rect x="65" y="20" width="20" height="60" fill="#4F9999" />
  </g>
  
  <!-- Offset Deep Charcoal Drop Shadow -->
  <text x="53" y="74" font-family="'Courier Prime', monospace, sans-serif" font-size="68" font-weight="bold" fill="#1F1F1F" text-anchor="middle">A</text>
  
  <!-- Crisp Off-White Letter with a sharp Charcoal border -->
  <text x="50" y="71" font-family="'Courier Prime', monospace, sans-serif" font-size="68" font-weight="bold" fill="#F4F4F4" stroke="#1F1F1F" stroke-width="2" text-anchor="middle">A</text>
</svg>
